name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          # push tag 触发：从 ref 读 tag；网页 Release 触发：从事件读 tag
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          TAG="${TAG#v}"
          VER="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag v$TAG 与 manifest 版本 $VER 不一致，请先同步版本号"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  build:
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v5
        with:
          name: packages
          path: dist/

  sign-firefox:
    # 未配置 AMO 凭据时跳过（Settings → Variables 设 AMO_ENABLED=true 启用）
    if: ${{ vars.AMO_ENABLED == 'true' }}
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: AMO 签名（未列出版本，自动更新通道）
        run: npx web-ext sign --source-dir . --artifacts-dir dist --channel unlisted
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      - uses: actions/upload-artifact@v5
        with:
          name: signed-xpi
          path: dist/

  release:
    # sign-firefox 被跳过（AMO 未启用）时不阻塞归档
    needs: [version-check, build, sign-firefox]
    if: ${{ needs.version-check.result == 'success' && needs.build.result == 'success' && (needs.sign-firefox.result == 'success' || needs.sign-firefox.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - name: 核对产物
        run: find dist -type f | sort
      - name: 创建或更新 Release（网页已发布则附加资产）
        run: |
          TAG="v${{ needs.version-check.outputs.version }}"
          FILES=$(find dist -type f \( -name "*.zip" -o -name "*.xpi" \) | tr '\n' ' ')
          gh release create "$TAG" $FILES --generate-notes 2>/dev/null \
            || gh release upload "$TAG" $FILES --clobber
