name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要归档的 tag（如 v1.0.0）"
        required: true

permissions:
  contents: write

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          # push tag 触发：从 ref 读 tag；网页 Release 触发：从事件读 tag
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          TAG="${TAG#v}"
          VER="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag v$TAG 与 manifest 版本 $VER 不一致，请先同步版本号"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  build:
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v5
        with:
          name: packages
          path: dist/

  release:
    needs: [version-check, build]
    if: ${{ always() && needs['version-check'].result == 'success' && needs['build'].result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - name: 核对产物
        run: find dist -type f | sort
      - name: 创建或更新 Release（网页已发布则附加资产）
        run: |
          TAG="v${{ needs['version-check'].outputs.version }}"
          FILES=$(find dist -type f -name "*.zip" | tr '\n' ' ')
          gh release create -R aqua2k1/minimal-newtab "$TAG" $FILES --generate-notes 2>/dev/null \
            || gh release upload -R aqua2k1/minimal-newtab "$TAG" $FILES --clobber
