<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>__MSG_newTabTitle__</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <div class="clock">
      <span id="time">00:00</span><span id="seconds" class="seconds">00</span>
    </div>
    <p id="date" class="date"></p>
    <form id="search-form" class="search-form" autocomplete="off">
      <input id="search-input" type="text" placeholder="__MSG_searchPlaceholder__" aria-label="__MSG_searchPlaceholder__">
    </form>
    <div class="update-banner" id="update-banner" hidden>
      <a id="update-link" href="https://github.com/aqua2k1/minimal-newtab/releases/latest" target="_blank" rel="noopener noreferrer" aria-label="__MSG_downloadUpdate__"></a>
      <button id="update-dismiss" type="button" title="__MSG_dismissUpdate__">✕</button>
    </div>
    <section class="todo">
      <button class="todo-toggle" id="todo-toggle" type="button">__MSG_todo__</button>
      <div class="todo-panel" id="todo-panel" hidden>
        <form class="todo-add" id="todo-add-form" autocomplete="off">
          <input id="todo-input" type="text" placeholder="__MSG_addTodoPlaceholder__" maxlength="100">
          <p class="todo-hint">__MSG_todoHint__</p>
        </form>
        <ul class="todo-list" id="todo-list"></ul>
        <footer class="todo-footer">
          <span id="todo-summary"></span>
          <button id="todo-clear" type="button" hidden>__MSG_clearDone__</button>
        </footer>
      </div>
    </section>
  </main>
  <script src="i18n.js"></script>
  <script src="todo-core.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
